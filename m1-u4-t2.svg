<title id="title">Cell Address और Range</title><desc id="desc">सेल एड्रेस कॉलम लेटर और रो नंबर का संयोजन होता है जैसे ए वन। एक्टिव सेल वह सेल होता है जिस पर वर्तमान में कर्सर होता है। सेल रेंज लगातार कई सेल का समूह होती है जिसे कॉलन द्वारा दर्शाया जाता है। उदाहरण के लिए ए वन से ए टेन तक की रे</desc>
