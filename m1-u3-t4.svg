<title id="title">Font, Alignment, Line Spacing और Indents</title><desc id="desc">Word Processing — फॉन्ट स्टाइल में एरियल और टाइम्स न्यू रोमन जैसे विकल्प होते हैं। एलाइनमेंट चार प्रकार के होते हैं जिनमें जस्टिफ़ाई शॉर्टकट कंट्रोल जे है। लाइन स्पेसिंग के लिए सिंगल स्पेसिंग हेतु कंट्रोल वन दबाया जाता है। डबल स्पेसिंग के लिए कंट्रोल टू और ड</desc>
