<title id="title">Find, Replace और Spell Check</title><desc id="desc">Word Processing — खोज और संपादन टूल डॉक्यूमेंट सुधारने के लिए अत्यंत उपयोगी हैं। फाइंड विकल्प से किसी विशिष्ट शब्द को तुरंत खोजा जाता है जिसका शॉर्टकट कंट्रोल एफ है। रिप्लेस विकल्प से पुराने शब्द की जगह नया शब्द बदला जाता है जिसका शॉर्टकट कंट्रोल एच है। स्पे</desc>
