<title id="title">Page Setup, Margins, Orientation और Columns</title><desc id="desc">Word Processing — पेज सेटअप डॉक्यूमेंट के भौतिक स्वरूप और छपाई को निर्धारित करता है। मार्जिन के जरिए पेज के चारों ओर खाली जगह छोड़ी जाती है। ओरिएंटेशन में पेज की दिशा पोर्ट्रेट या लैंडस्केप सेट की जाती है। पेपर साइज में ए4 और लीगल जैसे मानक आकार चुने जाते है</desc>
