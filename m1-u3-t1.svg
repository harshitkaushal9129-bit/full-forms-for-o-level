<title id="title">Word Processor परिचय और Interface</title><desc id="desc">Word Processing — वर्ड प्रोसेसर एक एप्लीकेशन सॉफ्टवेयर है जिसका उपयोग टेक्स्ट आधारित दस्तावेज बनाने के लिए होता है। इसके लोकप्रिय उदाहरण लिब्रे ऑफिस राइटर और माइक्रोसॉफ्ट वर्ड हैं। इसके इंटरफेस में सबसे ऊपर टाइटल बार और उसके नीचे मेनू बार होता है। मेनू बार म</desc>
