<title id="title">Input devices: Keyboard, Mouse, Scanner, OMR, OCR, MICR</title><desc id="desc">Computer Fundamentals — इनपुट डिवाइस वे हार्डवेयर उपकरण हैं जिनके माध्यम से यूजर डेटा और निर्देश कंप्यूटर में दर्ज करता है। कीबोर्ड सबसे आम टेक्स्ट इनपुट डिवाइस है जिसमें विभिन्न प्रकार की कुंजियाँ होती हैं। माउस एक पॉइंटिंग डिवाइस है जो स्क्रीन पर कर्सर की स्थिति</desc>
