<title id="title">Printers और Print Queue</title><desc id="desc">Operating System — प्रिंटिंग प्रबंधन के तहत प्रिंटर को कंप्यूटर से यूएसबी या नेटवर्क से जोड़ा जाता है। इसके बाद उसका सही ड्राइवर स्थापित करके प्रिंट कमांड दी जाती है। प्रिंट कतार वह व्यवस्था है जब एक साथ कई दस्तावेज प्रिंट के लिए भेजे जाते हैं। ऑपरेटिंग सिस्ट</desc>
