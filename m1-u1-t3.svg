<title id="title">Generations और प्रकार: Analog, Digital, Hybrid</title><desc id="desc">Computer Fundamentals — कंप्यूटर के विकास को मुख्य रूप से पाँच पीढ़ियों में बांटा गया है। प्रथम पीढ़ी में वैक्यूम ट्यूब का प्रयोग हुआ था जो आकार में बहुत बड़े थे। द्वितीय पीढ़ी में ट्रांजिस्टर के आने से कंप्यूटर छोटे और तेज हुए। तृतीय पीढ़ी में इंटीग्रेटेड सर्किट </desc>
