<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
<title id="title">GUI और CLI</title><desc id="desc">Operating System — यूजर इंटरफेस वह माध्यम है जिसके जरिए यूजर कंप्यूटर से संवाद स्थापित करता है। कमांड लाइन इंटरफेस में यूजर को कीबोर्ड से टेक्स्ट कमांड टाइप करने होते हैं। यह सीखने में थोड़ा कठिन होता है लेकिन इसमें ग्राफिक कार्ड की आवश्यकता नहीं होती। एमएस-ड</desc>
