<title id="title">Date/Time और Text Functions</title><desc id="desc">दिनांक और समय के लिए टुडे और नाउ फंक्शन्स का उपयोग होता है। टेक्स्ट फंक्शन्स में अपर और लोअर अक्षरों में बदलने के विकल्प होते हैं। लेंथ फंक्शन अक्षरों की संख्या गिनता है। कॉनकेटिनेट फंक्शन दो टेक्स्ट को आपस में जोड़ता है। ये डेटा</desc>
